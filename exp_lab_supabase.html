    /**
     * Supabase Auth + shop_profiles + shop_orders/shop_order_items 동기화
     */
    async function syncUserFromSupabase(authUser) {
      if (!authUser) {
        appState.currentUser = null;
        updateAllUI();
        return;
      }

      try {
        // 1) shop_profiles 에서 내 프로필 조회 (없으면 기본값 생성 시도)
        let { data: profile, error: profErr } = await db
          .from('shop_profiles')
          .select('id, email, name, phone, grade, points, role, created_at')
          .eq('id', authUser.id)
          .single();

        if (profErr || !profile) {
          const fallbackProfile = {
            id: authUser.id,
            email: authUser.email,
            name: authUser.user_metadata?.name || authUser.email.split('@')[0],
            phone: authUser.user_metadata?.phone || '',
            grade: 'WELCOME',
            points: 3000,
            role: 'member'
          };
          const { data: inserted } = await db
            .from('shop_profiles')
            .upsert(fallbackProfile, { onConflict: 'id' })
            .select()
            .single();
          profile = inserted || fallbackProfile;
        }

        // 2) shop_orders 및 shop_order_items 에서 내 주문 내역과 구매한 상품(ownedIds) 조회
        const { data: orders, error: ordErr } = await db
          .from('shop_orders')
          .select('id, total, status, created_at, shop_order_items(product_id, qty, unit_price)')
          .eq('user_id', authUser.id)
          .order('created_at', { ascending: false });

        const ownedSet = new Set();
        let calculatedSpent = 0;
        const history = [];

        if (!ordErr && Array.isArray(orders)) {
          orders.forEach(ord => {
            if (ord.status !== '취소') {
              calculatedSpent += Number(ord.total || 0);
            }
            const items = Array.isArray(ord.shop_order_items) ? ord.shop_order_items : [];
            items.forEach(it => {
              if (ord.status !== '취소') {
                ownedSet.add(Number(it.product_id));
              }
            });
            history.push({
              date: new Date(ord.created_at).toLocaleDateString('ko-KR'),
              desc: `주문 #${ord.id} (${ord.status}) · 경험 ${items.length}건`,
              delta: `${Number(ord.total || 0).toLocaleString()}원`
            });
          });
        }

        appState.currentUser = {
          id: profile.id,
          email: profile.email || authUser.email,
          name: profile.name || authUser.email.split('@')[0],
          phone: profile.phone || '',
          grade: profile.grade || 'WELCOME',
          points: Number(profile.points ?? 3000),
          role: profile.role || 'member',
          totalSpent: calculatedSpent,
          ownedIds: Array.from(ownedSet),
          history
        };
      } catch (err) {
        console.error('Supabase 회원/주문 동기화 오류:', err);
      }

      updateAllUI();
    }

    async function processInstantPayment() {
      if (!appState.currentUser) {
        closeCartModal();
        openAuthModal('signup');
        showToast('결제 및 콘텐츠 즉시 배포를 위해 회원가입(3,000P 지급) 또는 로그인해 주세요.');
        return;
      }

      const items = getCheckoutTargetProducts();
      if (items.length === 0) return;

      const subtotal = items.reduce((sum, p) => sum + Number(p.price), 0);
      const usedPoints = parseInt(document.getElementById('checkout-point-input').value || '0', 10);
      const finalPaid = subtotal - usedPoints;

      const prevTier = getUserTierInfo(appState.currentUser).current.name;
      const tierRate = getUserTierInfo(appState.currentUser).current.rate;
      const earnedPoints = Math.floor(finalPaid * tierRate);
      const nextPoints = Math.max(0, Number(appState.currentUser.points || 0) - usedPoints + earnedPoints);

      try {
        // 1) shop_orders 테이블에 주문 행 삽입
        const { data: orderRow, error: orderErr } = await db
          .from('shop_orders')
          .insert({
            user_id: appState.currentUser.id,
            total: finalPaid,
            status: '결제완료'
          })
          .select('id')
          .single();

        if (orderErr || !orderRow) {
          showToast(`주문 저장 실패: ${orderErr?.message || '알 수 없는 오류'}`, 'error');
          return;
        }

        // 2) shop_order_items 테이블에 주문 상세 행들 삽입
        const orderItemsPayload = items.map(item => ({
          order_id: orderRow.id,
          product_id: Number(item.id),
          qty: 1,
          unit_price: Number(item.price)
        }));

        const { error: itemsErr } = await db
          .from('shop_order_items')
          .insert(orderItemsPayload);

        if (itemsErr) {
          showToast(`주문 상세 저장 실패: ${itemsErr.message}`, 'error');
          return;
        }

        // 3) shop_profiles 포인트 및 등급 동기화 시도 (RLS 허용 범위 내 업데이트)
        const newTotalSpent = (appState.currentUser.totalSpent || 0) + finalPaid;
        let computedGrade = appState.currentUser.grade || 'WELCOME';
        if (computedGrade !== 'VIP') {
          for (let i = TIERS.length - 1; i >= 0; i--) {
            if (newTotalSpent >= TIERS[i].minSpent) {
              computedGrade = TIERS[i].name;
              break;
            }
          }
        }

        // 즉시 로컬 상태에도 반영 후 DB 재동기화
        items.forEach(it => {
          if (!appState.currentUser.ownedIds.includes(Number(it.id))) {
            appState.currentUser.ownedIds.push(Number(it.id));
          }
        });
        appState.currentUser.points = nextPoints;
        appState.currentUser.totalSpent = newTotalSpent;
        appState.currentUser.grade = computedGrade;

        if (appState.checkoutMode === 'cart') {
          appState.cartIds = appState.cartIds.filter(id => !items.some(it => Number(it.id) === Number(id)));
          saveState();
        }

        const { data: sessionData } = await db.auth.getSession();
        if (sessionData?.session?.user) {
          await syncUserFromSupabase(sessionData.session.user);
        } else {
          updateAllUI();
        }

        closeCartModal();

        let msg = `결제 완료(주문 #${orderRow.id})! <strong>${items.length}개의 경험(글 & 4K 영상)</strong>이 즉시 배포되었습니다.`;
        if (prevTier !== appState.currentUser.grade) {
          msg += ` 축하합니다! <strong>${appState.currentUser.grade}</strong> 등급으로 승급되었습니다!`;
        }
        showToast(msg);

        if (items.length === 1) {
          openProductModal(items[0].id);
        } else {
          openLibraryModal();
        }
      } catch (err) {
        console.error('결제 처리 예외:', err);
        showToast('결제 처리 중 오류가 발생했습니다.', 'error');
      }
    }
